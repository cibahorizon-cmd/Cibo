# CIBOO : configuration Render.
# Le nom du service ci-dessous (ciba-edition) détermine l'adresse .onrender.com.
#  - Première mise en ligne : vous pouvez remplacer « ciba-edition » par « ciboo » avant de créer le service.
#  - Service déjà créé : NE CHANGEZ PAS ce nom (ni celui du disque), sinon Render créerait un second service payant.
services:
  - type: web
    name: ciba-edition
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_DATA
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Sauvegarde Supabase (facultative) : ajoutez SUPABASE_URL et SUPABASE_SECRET_KEY dans Render, onglet Environment (voir LISEZ-MOI.md).
      # Ne les écrivez JAMAIS dans ce fichier, qui est envoyé sur GitHub.
    disk:
      name: ciba-data
      mountPath: /var/data
      sizeGB: 1
